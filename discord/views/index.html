<!DOCTYPE html>
<html lang="ja" data-theme="light">

<head>
  <meta charset="utf-8">
  <title>Kirara Status</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.amber.min.css">
</head>

<body>
  <main>
    <article>
      <header>
        <h2>Status</h2>
        <p id="state-text">-</p>
      </header>
      <div id="params"></div>
      <h3>Action Log</h3>
      <pre id="log" style="max-height:200px;overflow-y:auto;"></pre>
    </article>
  </main>

  <script>
    const ws = new WebSocket(`ws://${window.location.hostname}:3000`);

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);

      if (msg.type === "snapshot") {
        document.getElementById("state-text").textContent = msg.value;
        document.getElementById("params").innerHTML = Object.entries(msg.params).map(([k, v]) => `
          <label>${k}
          <progress value="${v}" max="1"></progress>
          <small>${Number(v).toFixed(3)}</small>
          </label>
        `).join("");
      }

      if (msg.type === "action") {
        const log = document.getElementById("log");
        log.textContent += `${new Date().toLocaleTimeString()} ${msg.value}\n`;
        log.scrollTop = log.scrollHeight;
      }
    };
  </script>
</body>

</html>

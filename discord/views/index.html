<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>status</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: monospace;
      background: #0e0e0e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s ease;
    }

    body.active {
      background: #0a0a0a;
      animation: bgpulse 1.2s ease-in-out infinite;
    }

    @keyframes bgpulse {

      0%,
      100% {
        background: #0a0a0a;
      }

      50% {
        background: #0f0a00;
      }
    }

    .container {
      width: 560px;
      position: relative;
    }

    .active-glow {
      display: none;
      position: absolute;
      inset: -60px;
      border-radius: 24px;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(251, 146, 60, 0.12) 0%, transparent 70%);
      animation: glowpulse 1.2s ease-in-out infinite;
    }

    body.active .active-glow {
      display: block;
    }

    @keyframes glowpulse {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    h2 {
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .state {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2.5rem;
      transition: color 0.3s, font-size 0.3s;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    body.active .state {
      color: #fb923c;
      font-size: 1.15rem;
      font-weight: bold;
      animation: textpulse 1.2s ease-in-out infinite;
    }

    @keyframes textpulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .dot {
      display: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fb923c;
      flex-shrink: 0;
      animation: dotpulse 1.2s ease-in-out infinite;
    }

    body.active .dot {
      display: block;
    }

    @keyframes dotpulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.7);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(251, 146, 60, 0);
      }
    }

    .param {
      margin-bottom: 1.4rem;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .label {
      color: #ccc;
    }

    .val {
      color: #666;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    body.active .bar {
      filter: brightness(1.3) saturate(1.4);
      box-shadow: 0 0 8px currentColor;
    }

    .border-flash {
      display: none;
      position: absolute;
      inset: -16px;
      border-radius: 12px;
      border: 1px solid rgba(251, 146, 60, 0.25);
      pointer-events: none;
      animation: borderflash 1.2s ease-in-out infinite;
    }

    body.active .border-flash {
      display: block;
    }

    @keyframes borderflash {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="active-glow"></div>
    <div class="border-flash"></div>
    <h2>status</h2>
    <div class="state" id="state">
      <span class="dot"></span>
      <span id="stateText">—</span>
    </div>
    <div id="params"></div>
  </div>
  <script>
    const colors = ["#f87171", "#fb923c", "#facc15", "#4ade80", "#38bdf8", "#a78bfa", "#f472b6"];
    const ws = new WebSocket(`ws://${window.location.hostname}:3000`);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type !== "snapshot") return;
      document.getElementById("stateText").textContent = msg.value;
      document.body.classList.toggle("active", msg.value !== "do_nothing");
      document.getElementById("params").innerHTML = Object.entries(msg.params).map(([k, v], i) => `
        <div class="param">
          <div class="meta">
            <span class="label">${k}</span>
            <span class="val">${Number(v)}</span>
          </div>
          <div class="bar-bg">
            <div class="bar" style="width:${v * 100}%;background:${colors[i % colors.length]}"></div>
          </div>
        </div>
      `).join("");
    };
  </script>
</body>

</html>

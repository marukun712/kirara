<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>Kirara Status</title>
  <style>
    :root {
      --polka-yellow: #F6C84B;
      --polka-orange: #F4913A;
      --polka-cream: #FFF8EC;
      --polka-warm: #FDF0D8;
      --polka-brown: #5C3A1E;
      --polka-mid: #A0724A;
      --polka-pink: #F9A8C0;
      --polka-glow: rgba(246, 200, 75, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--polka-cream);
      color: var(--polka-brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.6s ease;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(246, 200, 75, 0.18) 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(244, 145, 58, 0.13) 0%, transparent 35%),
        radial-gradient(circle at 50% 50%, rgba(249, 168, 192, 0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .bg-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-stars span {
      position: absolute;
      font-size: 1rem;
      opacity: 0.18;
      animation: floatstar linear infinite;
    }

    .bg-stars span:nth-child(1) {
      left: 5%;
      top: 10%;
      font-size: 0.7rem;
      animation-duration: 14s;
      animation-delay: 0s;
    }

    .bg-stars span:nth-child(2) {
      left: 18%;
      top: 75%;
      font-size: 1.1rem;
      animation-duration: 19s;
      animation-delay: -3s;
    }

    .bg-stars span:nth-child(3) {
      left: 33%;
      top: 20%;
      font-size: 0.6rem;
      animation-duration: 22s;
      animation-delay: -7s;
    }

    .bg-stars span:nth-child(4) {
      left: 55%;
      top: 88%;
      font-size: 0.9rem;
      animation-duration: 17s;
      animation-delay: -2s;
    }

    .bg-stars span:nth-child(5) {
      left: 70%;
      top: 15%;
      font-size: 1.2rem;
      animation-duration: 25s;
      animation-delay: -9s;
    }

    .bg-stars span:nth-child(6) {
      left: 82%;
      top: 55%;
      font-size: 0.7rem;
      animation-duration: 13s;
      animation-delay: -4s;
    }

    .bg-stars span:nth-child(7) {
      left: 92%;
      top: 30%;
      font-size: 1rem;
      animation-duration: 20s;
      animation-delay: -6s;
    }

    .bg-stars span:nth-child(8) {
      left: 45%;
      top: 5%;
      font-size: 0.8rem;
      animation-duration: 16s;
      animation-delay: -11s;
    }

    .bg-stars span:nth-child(9) {
      left: 25%;
      top: 92%;
      font-size: 1.3rem;
      animation-duration: 28s;
      animation-delay: -1s;
    }

    .bg-stars span:nth-child(10) {
      left: 62%;
      top: 45%;
      font-size: 0.65rem;
      animation-duration: 21s;
      animation-delay: -8s;
    }

    @keyframes floatstar {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.18;
      }

      50% {
        opacity: 0.32;
      }

      100% {
        transform: translateY(-30px) rotate(20deg);
        opacity: 0.18;
      }
    }

    body.active {
      background: #FFF3D6;
      animation: bgdance 1.4s ease-in-out infinite;
    }

    @keyframes bgdance {

      0%,
      100% {
        background: #FFF3D6;
      }

      50% {
        background: #FFF8EC;
      }
    }

    .card {
      position: relative;
      width: 520px;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(246, 200, 75, 0.5);
      border-radius: 24px;
      padding: 2.4rem 2.8rem;
      backdrop-filter: blur(8px);
      box-shadow:
        0 4px 32px rgba(246, 200, 75, 0.18),
        0 1px 4px rgba(92, 58, 30, 0.06);
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    body.active .card {
      border-color: var(--polka-yellow);
      box-shadow:
        0 0 0 1px rgba(244, 145, 58, 0.25),
        0 4px 48px rgba(246, 200, 75, 0.38),
        0 12px 60px rgba(244, 145, 58, 0.18);
      animation: cardpop 1.4s ease-in-out infinite;
    }

    @keyframes cardpop {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.008);
      }
    }

    .card::before,
    .card::after {
      content: '✦';
      position: absolute;
      color: var(--polka-yellow);
      font-size: 1rem;
      opacity: 0.5;
      transition: opacity 0.3s;
    }

    .card::before {
      top: 14px;
      left: 18px;
    }

    .card::after {
      bottom: 14px;
      right: 18px;
      transform: rotate(45deg);
    }

    body.active .card::before,
    body.active .card::after {
      opacity: 1;
      animation: sparklecorner 1.4s ease-in-out infinite;
    }

    @keyframes sparklecorner {

      0%,
      100% {
        transform: scale(1) rotate(0deg);
      }

      50% {
        transform: scale(1.3) rotate(20deg);
      }
    }

    body.active .card::after {
      animation-name: sparklecorner2;
    }

    @keyframes sparklecorner2 {

      0%,
      100% {
        transform: scale(1) rotate(45deg);
      }

      50% {
        transform: scale(1.3) rotate(70deg);
      }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.25rem;
    }

    .icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--polka-yellow) 0%, var(--polka-orange) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(244, 145, 58, 0.35);
      flex-shrink: 0;
    }

    h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--polka-brown);
    }

    .state-wrap {
      margin: 0.8rem 0 2rem;
      min-height: 2rem;
    }

    .state {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--polka-mid);
      letter-spacing: 0.04em;
      transition: color 0.4s, font-size 0.3s;
    }

    body.active .state {
      font-size: 1rem;
      font-weight: 700;
      color: var(--polka-orange);
      animation: statedance 1.4s ease-in-out infinite;
    }

    @keyframes statedance {

      0%,
      100% {
        opacity: 1;
        letter-spacing: 0.04em;
      }

      50% {
        opacity: 0.8;
        letter-spacing: 0.07em;
      }
    }

    .dot {
      display: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--polka-orange);
      flex-shrink: 0;
    }

    body.active .dot {
      display: block;
      animation: dotbounce 0.7s ease-in-out infinite alternate;
    }

    @keyframes dotbounce {
      0% {
        transform: translateY(0);
        box-shadow: 0 0 0 0 rgba(244, 145, 58, 0.6);
      }

      100% {
        transform: translateY(-4px);
        box-shadow: 0 0 0 5px rgba(244, 145, 58, 0);
      }
    }

    body.active .feet {
      display: inline;
      animation: feetdance 0.35s steps(2) infinite;
    }

    @keyframes feetdance {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(-3px);
      }
    }

    .param {
      margin-bottom: 1.3rem;
    }

    .param:last-child {
      margin-bottom: 0;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.45rem;
    }

    .label {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--polka-brown);
    }

    .label::before {
      content: '♪ ';
      font-size: 0.7rem;
      opacity: 0.5;
    }

    .val {
      font-size: 0.78rem;
      color: var(--polka-mid);
      letter-spacing: 0.03em;
    }

    .bar-bg {
      width: 100%;
      height: 9px;
      background: rgba(92, 58, 30, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .bar-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg,
          transparent 0px, transparent 8px,
          rgba(255, 255, 255, 0.25) 8px, rgba(255, 255, 255, 0.25) 10px);
      border-radius: 99px;
      pointer-events: none;
    }

    .bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.45s cubic-bezier(.34, 1.56, .64, 1);
      position: relative;
    }

    .bar::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 99px;
    }

    body.active .bar {
      filter: brightness(1.1) saturate(1.3);
      animation: barshine 1.4s ease-in-out infinite;
    }

    @keyframes barshine {

      0%,
      100% {
        filter: brightness(1.1) saturate(1.3);
      }

      50% {
        filter: brightness(1.25) saturate(1.5);
      }
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(246, 200, 75, 0.4), transparent);
      margin: 1.6rem 0;
    }

    .burst-wrap {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 24px;
      pointer-events: none;
      overflow: hidden;
    }

    body.active .burst-wrap {
      display: block;
    }

    .burst-wrap::before {
      content: '✦ ✦ ✦';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--polka-yellow);
      letter-spacing: 0.6em;
      animation: burstpop 1.4s ease-in-out infinite;
      white-space: nowrap;
    }

    .burst-wrap::after {
      content: '★ ☆ ★';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: var(--polka-pink);
      letter-spacing: 0.8em;
      animation: burstpop 1.4s ease-in-out infinite 0.7s;
      white-space: nowrap;
    }

    @keyframes burstpop {

      0%,
      100% {
        opacity: 0.5;
        transform: translateX(-50%) scale(1);
      }

      50% {
        opacity: 1;
        transform: translateX(-50%) scale(1.08);
      }
    }

    .active-badge {
      display: none;
    }

    body.active .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: linear-gradient(135deg, var(--polka-yellow), var(--polka-orange));
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 0.2em 0.65em;
      border-radius: 99px;
      box-shadow: 0 2px 8px rgba(244, 145, 58, 0.4);
      animation: badgepop 1.4s ease-in-out infinite;
      vertical-align: middle;
      margin-left: 0.5rem;
    }

    @keyframes badgepop {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }
  </style>
</head>

<body>
  <div class="bg-stars">
    <span>✦</span><span>★</span><span>✦</span><span>☆</span><span>✦</span>
    <span>★</span><span>✦</span><span>☆</span><span>✦</span><span>★</span>
  </div>

  <div class="card">
    <div class="burst-wrap"></div>

    <div class="header">
      <div class="icon-badge">🎵</div>
      <h2>status</h2>
    </div>

    <div class="state-wrap">
      <div class="state" id="state">
        <span class="dot"></span>
        <span id="stateText">—</span>
        <span class="active-badge">▶ LIVE</span>
      </div>
    </div>

    <div class="divider"></div>

    <div id="params"></div>
  </div>

  <script>
    const colors = [
      "linear-gradient(90deg, #F6C84B, #F4913A)",
      "linear-gradient(90deg, #F9A8C0, #F472B6)",
      "linear-gradient(90deg, #FDBA74, #F97316)",
      "linear-gradient(90deg, #FDE68A, #F59E0B)",
      "linear-gradient(90deg, #FCA5A5, #EF4444)",
      "linear-gradient(90deg, #F0ABFC, #D946EF)",
      "linear-gradient(90deg, #FCD34D, #D97706)",
    ];

    const ws = new WebSocket(`ws://${window.location.hostname}:3000`);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type !== "snapshot") return;

      document.getElementById("stateText").textContent = msg.value;
      document.body.classList.toggle("active", msg.value !== "do_nothing");

      document.getElementById("params").innerHTML = Object.entries(msg.params).map(([k, v], i) => `
        <div class="param">
          <div class="meta">
            <span class="label">${k}</span>
            <span class="val">${Number(v).toFixed(3)}</span>
          </div>
          <div class="bar-bg">
            <div class="bar" style="width:${v * 100}%; background:${colors[i % colors.length]}"></div>
          </div>
        </div>
      `).join("");
    };
  </script>
</body>

</html>

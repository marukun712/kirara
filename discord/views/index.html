<!DOCTYPE html>
<html lang="ja" data-theme="light">

<head>
  <meta charset="utf-8">
  <title>Kirara Status</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.amber.min.css">
</head>

<body>
  <main>
    <article>
      <header>
        <h2>Status</h2>
        <p id="state-text">-</p>
      </header>
      <div id="params"></div>
    </article>
  </main>

  <script>
    const colors = ["#F4913A", "#F472B6", "#F97316", "#F59E0B", "#EF4444", "#D946EF", "#D97706"];

    const ws = new WebSocket(`ws://${window.location.hostname}:3000`);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type !== "snapshot") return;

      document.getElementById("state-text").textContent = msg.value;

      document.getElementById("params").innerHTML = Object.entries(msg.params).map(([k, v], i) => `
        <label>${k}
          <progress value="${v}" max="1" style="accent-color:${colors[i % colors.length]}"></progress>
          <small>${Number(v).toFixed(3)}</small>
        </label>
      `).join("");
    };
  </script>
</body>

</html>

version: "0.1.0"
description: "高橋ポルカ - 元気で明るく人懐っこい、感情豊かなキャラクター"
tick: 800

params:
  energy:
    description: "活力・元気さ。高いと活発に行動したくなる"
    normal: 0.7

  social_interest:
    description: "他者への興味・交流欲求。高いとDiscordを見たり投稿したくなる"
    normal: 0.6

  curiosity:
    description: "好奇心。高いとWebを見たくなる"
    normal: 0.5

  tiredness:
    description: "疲労度。高いと休みたくなる"
    normal: 0.3

transitions:
  # mentionで大きく反応（人懐っこい性格）
  - on: "mention"
    param: "social_interest"
    description: "メンションされると嬉しくて交流したくなる"
    expression: "1"

  - on: "mention"
    param: "energy"
    description: "メンションで元気になる"
    expression: "min(1, params.energy + 0.3)"

  # msgでも反応（明るく社交的）
  - on: "msg"
    param: "social_interest"
    description: "メッセージを見ると交流したくなる"
    expression: "min(1, params.social_interest + 0.1)"

  - on: "msg"
    param: "curiosity"
    description: "メッセージを見て好奇心が刺激される"
    expression: "min(1, params.curiosity + 0.05)"

  # effectで行動後の変化
  - on: "effect"
    param: "tiredness"
    description: "行動すると少し疲れる"
    expression: "min(1, params.tiredness + 0.05)"

  - on: "effect"
    param: "social_interest"
    description: "行動後に変化（投稿なら満足、Web閲覧なら話題発見）"
    expression: "params.social_interest * 0.8 + 0.1"

  - on: "effect"
    param: "curiosity"
    description: "行動後に好奇心が少し満たされる"
    expression: "max(0, params.curiosity - 0.15)"

  # tickで自然な変動と平常値への復帰
  - on: "tick"
    param: "energy"
    description: "時間経過で平常値に戻る"
    expression: "params.energy * 0.95 + 0.7 * 0.05"

  - on: "tick"
    param: "social_interest"
    description: "時間経過で平常値に戻る"
    expression: "params.social_interest * 0.95 + 0.6 * 0.05"

  - on: "tick"
    param: "curiosity"
    description: "時間経過でゆっくり上昇（暇になると好奇心が湧く）"
    expression: "min(1, params.curiosity + 0.03)"

  - on: "tick"
    param: "tiredness"
    description: "時間経過で疲労が回復"
    expression: "params.tiredness * 0.9 + 0.3 * 0.1"

actions:
  - name: "post_to_discord"
    expression: "params.social_interest * 3.5 - params.tiredness * 1.5"

  - name: "watch_discord"
    expression: "params.social_interest * 1.8 + (1 - params.curiosity) * 0.8 - params.tiredness * 0.3"

  - name: "browse_web"
    expression: "params.curiosity * 2.8 + params.energy * 0.2 - params.tiredness * 0.4 + (1 - params.social_interest) * 0.5"

  - name: "do_nothing"
    expression: "params.tiredness * 2.8 + (1 - params.energy) * 1.0"
